{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><a href="{% url 'books_list' %}">Каталог</a></h1>
    </div>
    <div class="content">
        <div class="books">
            {% for book in books %}
            <div class="book">
                <h2>{{ book.name }}</h2>
                <p class="author">Автор: {{ book.author }}</p>
                <p class="date">
                    Дата публикации:
                    <a href="{% url 'books_by_date' book.pub_date|date:'Y-m-d' %}">
                        {{ book.pub_date|date:"Y-m-d" }} <!-- Добавили фильтр сюда, чтобы текст стал цифровым -->
                    </a>
                </p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
</body>
</html>
