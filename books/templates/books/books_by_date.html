{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><a href="{% url 'books_list' %}">Каталог</a></h1>
    </div>
    <div class="content">
        <div class="books">
            {% for book in books %}
            <div class="book">
                <h2>{{ book.name }}</h2>
                <p class="author">Автор: {{ book.author }}</p>
                <p class="date">Дата публикации: {{ book.pub_date|date:"Y-m-d" }}</p>
            </div>
            {% endfor %}
        </div>
        <div class="pagination">
            {% if prev_date %}
            <a href="{% url 'books_by_date' prev_date %}">&lt; {{ prev_date }}</a>
            {% endif %}
            {% if next_date %}
            <a href="{% url 'books_by_date' next_date %}">{{ next_date }} &gt;</a>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
